{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

    <style>
      .menu {
        padding: 0.5rem;
        background-color: #fff;
        position: relative;
        display: flex;
        justify-content: center;
        border-radius: 15px;
        box-shadow: 0 10px 25px 0 rgba(0, 0, 0, 0.075);
        margin: 12px auto;
        width: fit-content;
      }
      
      .link {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 70px;
        height: 50px;
        border-radius: 8px;
        position: relative;
        z-index: 1;
        overflow: hidden;
        transform-origin: center left;
        transition: width 0.2s ease-in;
        text-decoration: none;
        color: inherit;
      }
      
      .link:before {
        position: absolute;
        z-index: -1;
        content: '';
        display: block;
        border-radius: 8px;
        width: 100%;
        height: 100%;
        top: 0;
        transform: translateX(100%);
        transition: transform 0.2s ease-in;
        transform-origin: center right;
        background-color: #ffddb0;
      }
      
      .link:hover,
      .link:focus {
        outline: 0;
        width: 130px;
      }
      
      .link:hover:before,
      .link:focus:before {
        transform: translateX(0);
      }
      
      .link:hover .link-title,
      .link:focus .link-title {
        transform: translateX(0);
        opacity: 1;
      }
      
      .link-icon {
        width: 28px;
        height: 28px;
        display: block;
        flex-shrink: 0;
        left: 18px;
        position: absolute;
        color: #4a3f35;
      }
      
      .link-icon svg {
        width: 28px;
        height: 28px;
      }
      
      .link-title {
        transform: translateX(100%);
        transition: transform 0.2s ease-in;
        transform-origin: center right;
        display: block;
        text-align: center;
        text-indent: 28px;
        width: 100%;
        color: #4a3f35;
      }
    </style>

    <title>
      {% block title %}
        website
      {% endblock %}
    </title>
  </head>
  <body>
    <nav class="menu">
      <a href="{% url 'web_list' %}" class="link">
        <span class="link-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" fill="currentColor" viewBox="0 0 256 256">
            <rect width="256" height="256" fill="none"></rect>
            <path d="M213.3815,109.61945,133.376,36.88436a8,8,0,0,0-10.76339.00036l-79.9945,72.73477A8,8,0,0,0,40,115.53855V208a8,8,0,0,0,8,8H208a8,8,0,0,0,8-8V115.53887A8,8,0,0,0,213.3815,109.61945Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></path>
          </svg>
        </span>
        <span class="link-title">Home</span>
      </a>

      <a href="#" class="link">
        <span class="link-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" fill="currentColor" viewBox="0 0 256 256">
            <rect width="256" height="256" fill="none"></rect>
            <circle cx="116" cy="116" r="84" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></circle>
            <line x1="175.39356" y1="175.40039" x2="223.99414" y2="224.00098" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line>
          </svg>
        </span>
        <span class="link-title">Search</span>
      </a>

      {% if user.is_authenticated %}
        <a href="{% url 'register' %}" class="link" style="display:none;"></a>
        <span class="link">
          <span class="link-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" fill="currentColor" viewBox="0 0 256 256">
              <rect width="256" height="256" fill="none"></rect>
              <circle cx="128" cy="96" r="64" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="16"></circle>
              <path d="M30.989,215.99064a112.03731,112.03731,0,0,1,194.02311.002" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></path>
            </svg>
          </span>
          <span class="link-title">
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
              {% csrf_token %}
              <button type="submit" style="background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;">Logout</button>
            </form>
          </span>
        </span>
      {% else %}
        <a href="{% url 'login' %}" class="link">
          <span class="link-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" fill="currentColor" viewBox="0 0 256 256">
              <rect width="256" height="256" fill="none"></rect>
              <circle cx="128" cy="96" r="64" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="16"></circle>
              <path d="M30.989,215.99064a112.03731,112.03731,0,0,1,194.02311.002" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></path>
            </svg>
          </span>
          <span class="link-title">Login</span>
        </a>
      {% endif %}
    </nav>

    <div class="container">
      {% block content %}
        content here
      {% endblock %}
    </div>
  </body>
</html>
